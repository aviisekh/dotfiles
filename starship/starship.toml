"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
scan_timeout = 30
command_timeout = 800
palette = "sleek"

format = """
$hostname\
$directory\
$ruby\
$nodejs\
$docker_context\
${custom.git_host}\
${custom.git_conflicted_branch}\
${custom.git_staged_branch}\
${custom.git_dirty_branch}\
${custom.git_clean_branch}\
$git_status\
$line_break\
$character"""

right_format = "$status$jobs$cmd_duration$time"

[palettes.sleek]
bg = "#1a1b26"
blue = "#7aa2f7"
branch_clean = "#3d315f"
branch_conflicted = "#f7768e"
branch_dirty = "#174850"
branch_staged = "#203f35"
cyan = "#7dcfff"
fg = "#c0caf5"
green = "#9ece6a"
muted = "#565f89"
orange = "#ff9e64"
purple = "#bb9af7"
red = "#f7768e"
surface = "#292e42"
yellow = "#e0af68"

# Prompt character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[←](bold yellow)"

# Current directory
[directory]
style = "bold blue"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
read_only = " 󰌾 "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Development" = "󰲋 "
"Projects" = "󰲋 "

# GitHub marker shown only inside Git working trees
[custom.git_host]
command = 'printf git'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
symbol = " "
format = "[$symbol](fg:fg bold)"

# Status-aware Git branch pills. Only one of these can render at a time.
[custom.git_conflicted_branch]
command = 'branch=$(git branch --show-current 2>/dev/null); if [ -n "$branch" ]; then printf "%s" "$branch"; else git rev-parse --short HEAD; fi'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n "$(git diff --name-only --diff-filter=U)"'
symbol = " "
format = " [](fg:branch_conflicted)[ $symbol$output ](fg:bg bg:branch_conflicted bold)[](fg:branch_conflicted) "

[custom.git_staged_branch]
command = 'branch=$(git branch --show-current 2>/dev/null); if [ -n "$branch" ]; then printf "%s" "$branch"; else git rev-parse --short HEAD; fi'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git diff --name-only --diff-filter=U)" && ! git diff --cached --quiet --ignore-submodules --'
symbol = " "
format = " [](fg:branch_staged)[ $symbol$output ](fg:green bg:branch_staged bold)[](fg:branch_staged) "

[custom.git_dirty_branch]
command = 'branch=$(git branch --show-current 2>/dev/null); if [ -n "$branch" ]; then printf "%s" "$branch"; else git rev-parse --short HEAD; fi'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git diff --name-only --diff-filter=U)" && git diff --cached --quiet --ignore-submodules -- && { ! git diff --quiet --ignore-submodules -- || test -n "$(git ls-files --others --exclude-standard)"; }'
symbol = " "
format = " [](fg:branch_dirty)[ $symbol$output ](fg:red bg:branch_dirty bold)[](fg:branch_dirty) "

[custom.git_clean_branch]
command = 'branch=$(git branch --show-current 2>/dev/null); if [ -n "$branch" ]; then printf "%s" "$branch"; else git rev-parse --short HEAD; fi'
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z "$(git diff --name-only --diff-filter=U)" && git diff --quiet --ignore-submodules -- && git diff --cached --quiet --ignore-submodules -- && test -z "$(git ls-files --others --exclude-standard)"'
symbol = " "
format = " [](fg:branch_clean)[ $symbol$output ](fg:fg bg:branch_clean bold)[](fg:branch_clean) "

# Built-in Git branch is replaced by the status-aware pills above.
[git_branch]
disabled = true
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

# Git working-tree status
[git_status]
style = "fg:muted"
format = "[$all_status$ahead_behind]($style)"

conflicted = "[=${count}](bold red) "
ahead = "[↑${count}](bold blue) "
behind = "[↓${count}](bold purple) "
diverged = "[↕↑${ahead_count}↓${behind_count}](bold yellow) "
untracked = "[?${count}](bold cyan) "
stashed = "[*${count}](bold yellow) "
modified = "[!${count}](bold yellow) "
staged = "[+${count}](bold green) "
renamed = "[»${count}](bold purple) "
deleted = "[-${count}](bold red) "

# Ruby — shown only in Ruby projects
[ruby]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

# Node.js — shown only in Node projects
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

# Docker context
[docker_context]
symbol = "󰡨 "
style = "cyan"
format = "[$symbol$context]($style) "
only_with_files = true

# Show commands taking 1 second or longer
[cmd_duration]
min_time = 1000
style = "yellow"
format = " [$duration]($style)"

# Show non-zero exit codes on the right
[status]
disabled = false
symbol = "x "
success_symbol = ""
style = "red"
format = "[$symbol$status]($style)"

# Background jobs
[jobs]
symbol = "•"
style = "yellow"
format = " [$symbol$number]($style)"

# Clock on the right
[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = " [$time]($style)"

# Show hostname only during SSH sessions
[hostname]
ssh_only = true
style = "orange"
format = "[$hostname]($style) "

# Hide modules that usually create noise
[aws]
disabled = true

[gcloud]
disabled = true

[package]
disabled = true

[battery]
disabled = true
